name: Release

# Pushing a tag `vX.Y.Z` builds the three packages and publishes them as a
# GitHub Release of THIS repository (ADR-012, amended by ADR-014):
#
#   SignalLock-<version>.dmg              macOS, universal, signed + notarized
#   SignalLock-<version>-setup.exe        Windows installer (Inno Setup), unsigned
#   SignalLock-<version>-x86_64.AppImage  Linux
#   ...each with a <file>.sha256
#
# Assets carry ONLY the versioned name: no stable-named copy, and nothing may
# link to releases/latest/download (user decision, 2026-11-12).
#
#   Cut a release:  bump workspace.package.version in Cargo.toml, commit,
#                   then `git tag vX.Y.Z && git push origin vX.Y.Z`. The job fails
#                   when the tag and the workspace version disagree.
#   Re-run without publishing: Actions tab -> Release -> "Run workflow", choosing
#                   an existing `v*` tag in "Use workflow from" (the `release`
#                   environment only admits `v*` tags, see below). Builds, signs
#                   and notarizes everything, uploads the packages as workflow
#                   artifacts and publishes nothing: only a tag PUSH publishes.
#
# Build and signing are separate jobs. `build-macos` compiles the app (all
# third-party build scripts and proc-macros run there) with NO access to any
# secret and uploads an unsigned bundle. `sign-macos` only downloads that
# bundle and signs, notarizes and packages it: no cargo, no build script, no
# dependency code runs where the certificate is. It is bound to the `release`
# environment, and it never produces an ad-hoc package: when a secret is
# missing it stops with an error.
#
# Secrets live ONLY in the `release` environment of this repository
# (Settings -> Environments -> release -> Environment secrets):
#
#   MACOS_CERT_P12_BASE64   base64 of the exported Developer ID Application .p12
#                           (Keychain Access -> export the certificate WITH its
#                           private key as .p12, then `base64 -i file.p12`)
#   MACOS_CERT_PASSWORD     password chosen when exporting the .p12
#   APPLE_ID                Apple ID used for notarytool
#   APPLE_APP_PASSWORD      app-specific password for that Apple ID
#                           (account.apple.com -> Sign-In and Security)
#   APPLE_TEAM_ID           Apple Developer Team ID
#
# This file holds no secret, e-mail address or certificate. Restrict the
# environment to `v*` tags only (Deployment branches and tags -> Selected
# branches and tags -> tag rule `v*`) and, if you like, add a required reviewer.
#
# The unsigned bundle travels between the two macOS jobs as a workflow
# artifact. Its SHA-256 is published by build-macos as a job output (which no
# other job can change) and sign-macos refuses to unpack anything else.
# The same holds for publishing: sign-macos, windows and linux each publish the
# SHA-256 of their package as a job output, and publish refuses to release a
# file whose hash differs from it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # fmt, clippy, test and release build on all three platforms (ci.yml). No
  # package is built from a commit that is red.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The tag is only a label; the version lives in Cargo.toml. Refuse to build
  # a release whose files would say one version and whose tag another.
  verify-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compare tag with workspace version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(./scripts/version.sh)"
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ "${REF_NAME}" != "v${version}" ]]; then
              echo "::error title=Tag does not match the workspace version::Tag '${REF_NAME}' but workspace.package.version in Cargo.toml is '${version}'. Bump Cargo.toml (and Cargo.lock), commit, delete the tag, then re-tag."
              exit 1
            fi
            echo "Tag ${REF_NAME} matches workspace version ${version}"
          else
            echo "::notice::Dry run on ${REF_NAME}: building version ${version}, nothing will be published."
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # Compiles and bundles. Runs every dependency's build.rs and proc-macro, so
  # it must never see a secret: no `environment`, no `secrets.*`, no keychain.
  build-macos:
    needs: [verify-version, ci]
    runs-on: macos-latest
    outputs:
      app_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain (universal targets)
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      # Ad-hoc signed universal bundle; the Developer ID signature is applied
      # later, in sign-macos.
      - name: Build the universal app bundle
        run: ./scripts/build-macos.sh

      # ditto keeps the bundle's structure and attributes intact in the zip.
      - name: Pack the unsigned bundle
        id: pack
        run: |
          set -euo pipefail
          mkdir -p bundle
          ditto -c -k --keepParent target/SignalLock.app bundle/SignalLock.app.zip
          sha256="$(shasum -a 256 bundle/SignalLock.app.zip | awk '{print $1}')"
          echo "Bundle archive SHA-256: ${sha256}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: macos-app-unsigned
          path: bundle/SignalLock.app.zip
          if-no-files-found: error
          retention-days: 1

  # Signs, notarizes and packages the bundle from build-macos. Nothing here
  # compiles: there is no rustup, no cargo and no build script in this job.
  # The secrets are read only here, from the `release` environment.
  sign-macos:
    needs: [verify-version, build-macos]
    runs-on: macos-latest
    environment: release
    outputs:
      package_sha256: ${{ steps.package-hash.outputs.sha256 }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      # Our own scripts only (make-dmg.sh, version.sh); no dependency code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Fail loudly rather than ship an unsigned or un-notarized package.
      - name: Require signing and notarization secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing macOS signing secrets::Secrets not set in the 'release' environment: ${missing[*]}. The macOS package is never published unsigned (ADR-014). Add them under Settings -> Environments -> release."
            exit 1
          fi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: macos-app-unsigned
          path: bundle

      # The archive must be the one build-macos packed: compare it with the
      # hash that job published as its output before anything is unpacked.
      - name: Verify the bundle archive hash
        env:
          EXPECTED_SHA256: ${{ needs.build-macos.outputs.app_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Missing bundle hash::build-macos did not publish a valid SHA-256 for the bundle archive."
            exit 1
          fi
          actual="$(shasum -a 256 bundle/SignalLock.app.zip | awk '{print $1}')"
          if [[ "${actual}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error title=Bundle archive hash mismatch::The downloaded macos-app-unsigned archive (${actual}) is not the one build-macos produced (${EXPECTED_SHA256}). Refusing to sign it."
            exit 1
          fi
          echo "Bundle archive matches build-macos (${actual})"

      - name: Unpack and check the bundle
        run: |
          set -euo pipefail
          mkdir -p target
          ditto -x -k bundle/SignalLock.app.zip target
          rm -rf bundle
          app="target/SignalLock.app"
          test -x "${app}/Contents/MacOS/SignalLock"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          if [[ "${bundle_version}" != "${VERSION}" ]]; then
            echo "::error::Bundle version ${bundle_version} differs from ${VERSION}."
            exit 1
          fi
          archs="$(lipo -archs "${app}/Contents/MacOS/SignalLock")"
          if [[ "${archs}" != *x86_64* || "${archs}" != *arm64* ]]; then
            echo "::error::Bundle is not universal (archs: ${archs})."
            exit 1
          fi

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="${RUNNER_TEMP}/certificate.p12"

          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${cert}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert}" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          rm -f "${cert}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" >/dev/null

          # Put the temporary keychain first in the user search list.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "${keychain}" ${existing}

          # Select the identity by certificate hash, so the personal name in
          # the identity string never appears in this workflow or in our own
          # log lines (the signed bundle carries it publicly anyway, and
          # `spctl` prints it). The certificate must belong to our team.
          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | awk -v team="(${APPLE_TEAM_ID})" '/Developer ID Application/ && index($0, team) { print $2; exit }')"
          if [[ -z "${identity}" ]]; then
            echo "::error title=No Developer ID Application identity::The imported .p12 holds no valid 'Developer ID Application' certificate (with its private key) for team APPLE_TEAM_ID. Re-export the certificate together with its private key."
            exit 1
          fi

          {
            echo "SIGNING_KEYCHAIN=${keychain}"
            echo "APPLE_DEV_ID=${identity}"
          } >> "${GITHUB_ENV}"

      # store-credentials also validates the Apple ID / app-specific password
      # against Apple, so a wrong secret fails here and not after packaging.
      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials signallock-notary \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --keychain "${SIGNING_KEYCHAIN}"

      # make-dmg.sh --skip-build re-signs the bundle with the hardened runtime
      # and a secure timestamp, builds and signs the dmg, submits the app and
      # the dmg with `notarytool submit --wait` and staples both tickets.
      - name: Sign, notarize and package the DMG
        env:
          NOTARY_PROFILE: signallock-notary
          NOTARY_KEYCHAIN: ${{ env.SIGNING_KEYCHAIN }}
        run: ./scripts/make-dmg.sh --skip-build

      - name: Verify the result
        run: |
          set -euo pipefail
          dmg="dist/SignalLock-${VERSION}.dmg"
          test -f "${dmg}" && test -f "${dmg}.sha256"
          (cd dist && shasum -a 256 -c "SignalLock-${VERSION}.dmg.sha256")
          xcrun stapler validate "${dmg}"
          xcrun stapler validate target/SignalLock.app
          codesign --verify --deep --strict --verbose=2 target/SignalLock.app
          spctl --assess --type execute --verbose=2 target/SignalLock.app
          lipo -archs target/SignalLock.app/Contents/MacOS/SignalLock

      # Last step that touches the dmg. publish compares what it downloads with
      # this job output, which no other job can change.
      - name: Publish the DMG hash as a job output
        id: package-hash
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 "dist/SignalLock-${VERSION}.dmg" | awk '{print $1}')"
          echo "DMG SHA-256: ${sha256}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Remove the temporary keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
          rm -f "${RUNNER_TEMP}/certificate.p12"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: macos-package
          path: |
            dist/SignalLock-${{ needs.verify-version.outputs.version }}.dmg
            dist/SignalLock-${{ needs.verify-version.outputs.version }}.dmg.sha256
          if-no-files-found: error

  windows:
    needs: [verify-version, ci]
    runs-on: windows-latest
    outputs:
      package_sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # build.rs embeds the icon and the DPI-awareness manifest (winresource).
      - name: cargo build --release
        shell: bash
        run: cargo build --release --locked

      # Pinned: the compiler that produces the shipped installer must not
      # change between tags without a commit.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }

      - name: Build the installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) {
            $iscc = $command.Source
          } else {
            $iscc = Get-ChildItem -Path @(${env:ProgramFiles(x86)}, $env:ProgramFiles) -Filter 'Inno Setup *' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          Write-Host "Using $iscc"
          & $iscc "/DMyAppVersion=$env:VERSION" 'packaging\windows\SignalLock.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $name = "SignalLock-$env:VERSION-setup.exe"
          $path = Join-Path 'dist' $name
          if (-not (Test-Path $path)) { throw "Expected installer not found: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
          [System.IO.File]::WriteAllText("$((Get-Location).Path)\dist\$name.sha256", "$hash  $name`n")
          Get-Content "dist\$name.sha256"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-package
          path: |
            dist/SignalLock-${{ needs.verify-version.outputs.version }}-setup.exe
            dist/SignalLock-${{ needs.verify-version.outputs.version }}-setup.exe.sha256
          if-no-files-found: error

  linux:
    needs: [verify-version, ci]
    runs-on: ubuntu-22.04
    outputs:
      package_sha256: ${{ steps.package-hash.outputs.sha256 }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      # Pinned tool releases; the downloads are verified against these hashes.
      LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Keep in step with scripts/build-appimage.sh and ci.yml.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libdbus-1-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download linuxdeploy and appimagetool (checksum-verified)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}"
          curl -fsSL --retry 3 -o "${tools}/linuxdeploy" "${LINUXDEPLOY_URL}"
          curl -fsSL --retry 3 -o "${tools}/appimagetool" "${APPIMAGETOOL_URL}"
          echo "${LINUXDEPLOY_SHA256}  ${tools}/linuxdeploy" | sha256sum -c -
          echo "${APPIMAGETOOL_SHA256}  ${tools}/appimagetool" | sha256sum -c -
          chmod +x "${tools}/linuxdeploy" "${tools}/appimagetool"
          echo "LINUXDEPLOY=${tools}/linuxdeploy" >> "${GITHUB_ENV}"
          echo "APPIMAGETOOL=${tools}/appimagetool" >> "${GITHUB_ENV}"

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Publish the AppImage hash as a job output
        id: package-hash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "dist/SignalLock-${VERSION}-x86_64.AppImage" | awk '{print $1}')"
          echo "AppImage SHA-256: ${sha256}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-package
          path: |
            dist/SignalLock-${{ needs.verify-version.outputs.version }}-x86_64.AppImage
            dist/SignalLock-${{ needs.verify-version.outputs.version }}-x86_64.AppImage.sha256
          if-no-files-found: error

  # Runs only for tags, and only when all three packages built. Publishes the
  # release directly (not a draft).
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify-version, sign-macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Artifacts are fetched by name, one by one: build-macos' unsigned bundle
      # (macos-app-unsigned) is never downloaded here, and nothing that merely
      # happens to match a pattern can end up in dist/.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: macos-package
          path: dist

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: windows-package
          path: dist

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: linux-package
          path: dist

      # Each producing job published the SHA-256 of its package as a job output.
      # What was downloaded must match it; the .sha256 files that travelled
      # with the artifacts are not trusted and are rewritten from the outputs.
      - name: Verify every package against its job output
        env:
          DMG_SHA256: ${{ needs.sign-macos.outputs.package_sha256 }}
          EXE_SHA256: ${{ needs.windows.outputs.package_sha256 }}
          APPIMAGE_SHA256: ${{ needs.linux.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          check() {
            local file="$1" expected="$2" actual
            if [[ ! "${expected}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error title=Missing package hash::The job that built ${file} did not publish a valid SHA-256."
              exit 1
            fi
            test -f "${file}" || { echo "::error::Missing asset ${file}"; exit 1; }
            actual="$(sha256sum "${file}" | awk '{print $1}')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error title=Package hash mismatch::${file} is ${actual} but its build job produced ${expected}. Nothing is published."
              exit 1
            fi
            printf '%s  %s\n' "${expected}" "${file}" > "${file}.sha256"
            echo "ok  ${file}  ${expected}"
          }
          check "SignalLock-${VERSION}.dmg" "${DMG_SHA256}"
          check "SignalLock-${VERSION}-setup.exe" "${EXE_SHA256}"
          check "SignalLock-${VERSION}-x86_64.AppImage" "${APPIMAGE_SHA256}"
          # Only the versioned names are published (no stable-named copy, no strays).
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          ls -l

      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            echo "### SignalLock ${VERSION}"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for sum in dist/*.sha256; do
              read -r hash name < "${sum}"
              echo "| \`${name}\` | \`${hash}\` |"
            done
            echo
            echo "Verify a download with \`shasum -a 256 <file>\` (macOS), \`sha256sum <file>\` (Linux) or \`Get-FileHash -Algorithm SHA256 <file>\` (Windows) and compare it with the table above."
          } > "${RUNNER_TEMP}/notes.md"

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          flags=()
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" \
            "dist/SignalLock-${VERSION}.dmg" \
            "dist/SignalLock-${VERSION}.dmg.sha256" \
            "dist/SignalLock-${VERSION}-setup.exe" \
            "dist/SignalLock-${VERSION}-setup.exe.sha256" \
            "dist/SignalLock-${VERSION}-x86_64.AppImage" \
            "dist/SignalLock-${VERSION}-x86_64.AppImage.sha256" \
            --verify-tag \
            --title "SignalLock ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${flags[@]}"
