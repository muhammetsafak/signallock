[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/muhammetsafak/signallock"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
